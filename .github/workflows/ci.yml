name: Pull request verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: florabase_ci
  POSTGRES_USER: florabase_ci
  POSTGRES_PASSWORD: disposable-ci-password
  FLORABASE_DATABASE_URL: postgresql+psycopg://florabase_ci:disposable-ci-password@db:5432/florabase_ci

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run required quality checks
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci-verify.py quality 2>&1 | tee "$RUNNER_TEMP/ci-quality.log"
      - name: Retain complete quality log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-quality.log
          retention-days: 14

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run required integration checks
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci-verify.py integration 2>&1 | tee "$RUNNER_TEMP/ci-integration.log"
      - name: Retain complete integration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-integration-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-integration.log
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run required build checks
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci-verify.py build 2>&1 | tee "$RUNNER_TEMP/ci-build.log"
      - name: Retain complete build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build.log
          retention-days: 14
