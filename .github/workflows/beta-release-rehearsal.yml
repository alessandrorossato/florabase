name: Non-publishing beta release rehearsal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Match the protected publication runner's CLI and default-builder setup.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
          use: false
      - name: Rehearse release pipeline in an owned local registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beta-release-rehearsal.log"
          output="$RUNNER_TEMP/beta-release-rehearsal"
          trap 'if test -d "$output"; then cp "$log" "$output/rehearsal.log"; fi' EXIT
          python3 scripts/release-tools.py scripts/rehearse-beta-release.py \
            --output "$output" 2>&1 | tee "$log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: beta-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta-release-rehearsal/
          if-no-files-found: ignore
          retention-days: 90
