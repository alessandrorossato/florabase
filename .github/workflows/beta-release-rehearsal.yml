name: Non-publishing Florabase release rehearsal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check verification scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/ci-verify.py rehearse-scope; then
            echo "Rehearsal scope fallback: running full rehearsal (scope command failed)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Match the protected publication runner's CLI and default-builder setup.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.skip != 'true'
        with:
          version: v0.38.1
          driver: docker
          use: false
      - name: Rehearse release pipeline in an owned local registry
        if: steps.scope.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          # Pull requests compare with their base, pushes with the previous main; manual runs stay strict.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beta-release-rehearsal.log"
          output="$RUNNER_TEMP/beta-release-rehearsal"
          python3 scripts/release-tools.py scripts/rehearse-beta-release.py \
            --hosted --base "$BASE_SHA" --output "$output" 2>&1 | tee "$log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: beta-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/beta-release-rehearsal/
            ${{ runner.temp }}/beta-release-rehearsal.log
          if-no-files-found: ignore
          retention-days: 90
