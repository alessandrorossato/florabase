# Development, from source (ADR 0008). Standalone: `docker compose -f compose.dev.yaml` builds the
# development targets. Workflow stacks (production-target source builds, review, UAT, quality,
# preview, sourcing, performance) are derived from this file at run time by scripts/compose_stacks.py
# with generated override files under untracked state. Installations use the release compose.yaml.
name: florabase

x-source: &source
  io.florabase.role: ${FLORABASE_ROLE:-dev}
  io.florabase.source: ${FLORABASE_SOURCE:-unknown}
  io.florabase.branch: ${FLORABASE_BRANCH:-unknown}
  io.florabase.sha: ${FLORABASE_SHA:-unknown}
  io.florabase.dirty: ${FLORABASE_DIRTY:-unknown}

services:
  dev-state-init:
    labels: *source
    image: ${COMPOSE_PROJECT_NAME:-florabase}-frontend-development
    build:
      context: ./frontend
      target: development
    user: "0:0"
    entrypoint: [florabase-dev-state-init]
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - frontend_node_modules:/app/node_modules
      - attachment_data:/state/attachments
    restart: "no"
    networks: [internal]

  db:
    labels: *source
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  backend:
    labels: *source
    image: ${COMPOSE_PROJECT_NAME:-florabase}-backend-development
    build:
      context: ./backend
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      FLORABASE_ENVIRONMENT: development
      FLORABASE_DATABASE_URL: ${FLORABASE_DATABASE_URL:?Set FLORABASE_DATABASE_URL in .env}
      FLORABASE_CANONICAL_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      FLORABASE_COOKIE_MODE: loopback-development
      FLORABASE_CORS_ORIGINS: ${FLORABASE_CORS_ORIGINS:-[]}
      FLORABASE_LOG_LEVEL: ${FLORABASE_LOG_LEVEL:-INFO}
      FLORABASE_LOG_FORMAT: text
      FLORABASE_ATTACHMENT_STORAGE_ROOT: /var/lib/florabase/attachments
      FLORABASE_WFO_SNAPSHOT_PATH: ${FLORABASE_WFO_SNAPSHOT_PATH:-/app/src/.source-cache/wfo-2026-06.sqlite}
      FLORABASE_WCVP_SNAPSHOT_PATH: ${FLORABASE_WCVP_SNAPSHOT_PATH:-/app/src/.source-cache/wcvp-v15.sqlite}
      FLORABASE_WCVP_V16_SNAPSHOT_PATH: ${FLORABASE_WCVP_V16_SNAPSHOT_PATH:-/app/src/.source-cache/wcvp-v16/index.sqlite}
      FLORABASE_WCVP_V16_REQUIRE_SEAL: ${FLORABASE_WCVP_V16_REQUIRE_SEAL:-false}
      COVERAGE_FILE: /tmp/florabase-coverage
      MYPY_CACHE_DIR: /tmp/florabase-mypy
      PYTEST_ADDOPTS: -o cache_dir=/tmp/florabase-pytest
      RUFF_CACHE_DIR: /tmp/florabase-ruff
    volumes:
      - attachment_data:/var/lib/florabase/attachments
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/openapi.json:/app/openapi.json
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/requirements.lock:/app/requirements.lock
      - ./backend/requirements-dev.lock:/app/requirements-dev.lock
    depends_on:
      db:
        condition: service_healthy
      dev-state-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [internal]
    init: true
    stop_grace_period: 15s

  frontend:
    labels: *source
    image: ${COMPOSE_PROJECT_NAME:-florabase}-frontend-development
    build:
      context: ./frontend
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BACKEND_PROXY_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
      dev-state-init:
        condition: service_completed_successfully
    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/backend/openapi.json:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks: [internal]
    init: true
    stop_grace_period: 10s

networks:
  internal:

volumes:
  postgres_data:
  attachment_data:
  frontend_node_modules:
