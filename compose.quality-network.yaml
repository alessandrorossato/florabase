# Opt-in overlay for Quality commands that genuinely require outbound networking
# (dependency lockfile updates and remote reference archive downloads).
# Using Docker's shared built-in bridge network avoids creating per-worktree
# user-defined bridge subnets while keeping ports unpublished.
x-owner: &owner
  io.florabase.workflow.lifecycle: quality
  io.florabase.workflow.owner: ${FLORABASE_WORKFLOW_OWNER:?Quality metadata required}
  io.florabase.workflow.source: ${FLORABASE_SOURCE:?Quality source required}

services:
  backend:
    network_mode: bridge
    networks: !reset []
    ports: !reset []
    environment:
      HOME: /tmp/florabase-backend-home
      XDG_CACHE_HOME: /tmp/florabase-backend-cache
  frontend:
    network_mode: bridge
    networks: !reset []
    ports: !reset []
    environment:
      FLORABASE_QUALITY_OFFLINE: "0"
  frontend-lockfile:
    labels: *owner
    image: ${COMPOSE_PROJECT_NAME:?Quality project required}-frontend-toolchain
    build:
      context: ./frontend
      target: toolchain
      labels:
        <<: *owner
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME:?Quality project required}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: bridge
    networks: !reset []
    ports: !reset []
    environment:
      HOME: /tmp/florabase-frontend-home
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ./frontend:/app
    working_dir: /app
    restart: "no"
