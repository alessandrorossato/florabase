log_format florabase_auth '$request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/v1/auth/ {
        access_log /dev/stdout florabase_auth;
        client_max_body_size 32m;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        client_max_body_size 32m;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        # Compress public static assets only; authenticated API responses are excluded.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri $uri/ /index.html;
    }

    location = /release.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The blocking preference store must revalidate alongside each deployed app bundle.
    location = /appearance.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service worker must never be cached by HTTP caches so updates are discovered immediately.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
        try_files $uri =404;
    }

    # Web App Manifest must revalidate to reflect updates immediately.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Offline shell fallback page, stylesheet and script must revalidate with each release.
    location = /offline.html {
        add_header Cache-Control "no-cache";
        default_type text/html;
        try_files $uri =404;
    }

    location = /offline.css {
        add_header Cache-Control "no-cache";
        default_type text/css;
        try_files $uri =404;
    }

    location = /offline.js {
        add_header Cache-Control "no-cache";
        default_type application/javascript;
        try_files $uri =404;
    }

    # PWA icons and favicons may be cached for up to a day.
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Main SPA entrypoint must revalidate on every navigation so new bundle hashes are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
