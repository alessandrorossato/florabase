<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153a2c" />
    <title>Florabase — Unavailable</title>
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main class="offline-card" role="main">
      <svg
        class="brand-icon"
        viewBox="0 0 512 512"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect width="512" height="512" rx="112" fill="#153a2c" />
        <path
          d="M 235 313 C 213 265 174 219 139 231 C 122 271 161 320 235 313 Z"
          fill="#8dc5a3"
        />
        <path
          d="M 242 330 C 228 253 277 160 375 148 C 382 235 340 323 242 330 Z"
          fill="#f4f8f5"
        />
        <path
          d="M 235 340 C 260 279 305 220 368 155"
          stroke="#153a2c"
          stroke-width="15"
          stroke-linecap="round"
        />
        <path
          d="M 193 392 C 212 368 224 347 242 330"
          stroke="#8dc5a3"
          stroke-width="21"
          stroke-linecap="round"
        />
      </svg>
      <p class="eyebrow">Self-hosted botanical records</p>
      <h1>Florabase cannot be reached</h1>
      <p>
        You may be offline, or your Florabase server may be restarting or
        upgrading. An active connection is required: Florabase does not store
        private botanical records on this device.
      </p>
      <a id="retry-btn" class="retry-btn" href="/">Retry connection</a>
    </main>
    <script src="/offline.js" defer></script>
  </body>
</html>
