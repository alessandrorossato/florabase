# Only the worktree-scoped QUALITY helper loads this lifecycle overlay.
x-owner: &owner
  io.florabase.workflow.lifecycle: quality
  io.florabase.workflow.owner: ${FLORABASE_WORKFLOW_OWNER:?Quality metadata required}
  io.florabase.workflow.source: ${FLORABASE_SOURCE:?Quality source required}

services:
  db:
    labels: *owner
    network_mode: none
    networks: !reset []
    ports: !reset []
  backend:
    labels: *owner
    network_mode: none
    networks: !reset []
    ports: !reset []
    build:
      labels:
        <<: *owner
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME:?Quality project required}
  frontend:
    labels: *owner
    network_mode: none
    networks: !reset []
    ports: !reset []
    environment:
      # Keep the full jsdom suite stable on small linked-worktree hosts.
      VITEST_MAX_WORKERS: "1"
      FLORABASE_QUALITY_OFFLINE: "1"
    build:
      labels:
        <<: *owner
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME:?Quality project required}
  dev-state-init:
    labels: *owner
    network_mode: none
    networks: !reset []
    build:
      labels:
        <<: *owner
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME:?Quality project required}
networks: !reset {}
volumes:
  postgres_data:
    labels: *owner
  attachment_data:
    labels: *owner
  frontend_node_modules:
    labels: *owner
