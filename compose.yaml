# Florabase — self-hosted deployment (linux/amd64). See docs/installation.md.
# ===== ONE-TIME SETUP BEFORE THE FIRST START (run as root; adjust both paths) =====
# DATA=/volume1/docker/florabase/data; BACKUP=/volume1/docker/florabase/backup
# mkdir -p "$DATA/postgres" "$DATA/media" "$DATA/state" "$BACKUP/pre-upgrade"
# chmod a+rx "$DATA"; chmod a+x "$BACKUP"
# chown 70:70 "$DATA/postgres"; chmod 0700 "$DATA/postgres"
# chown 10001:10001 "$DATA/media" "$DATA/state" "$BACKUP/pre-upgrade"
# chmod 0700 "$DATA/media" "$BACKUP/pre-upgrade"; chmod 0755 "$DATA/state"
# Without these folders and owners, db and backend refuse to start (docs/installation.md, step 1).
# Then edit the volume paths, FLORABASE_DB_PASSWORD (same in db and backend), FLORABASE_CANONICAL_ORIGIN.
services:
  db:
    image: ghcr.io/alessandrorossato/florabase-postgres:latest
    container_name: florabase-db
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      - FLORABASE_DB_PASSWORD=change-me          # generate with: openssl rand -hex 32
    volumes:
      - /volume1/docker/florabase/data:/var/lib/postgresql          # change the left side to your data folder

  backend:
    image: ghcr.io/alessandrorossato/florabase-backend:latest
    container_name: florabase-backend
    restart: unless-stopped
    command: ["florabase-start"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      - TZ=Europe/Rome
      - FLORABASE_DB_PASSWORD=change-me          # must match db
      - FLORABASE_CANONICAL_ORIGIN=https://florabase.example.org
      # Optional one-time first owner (remove after first sign-in):
      # - FLORABASE_OWNER_LOGIN=owner
      # - FLORABASE_OWNER_PASSWORD=change-me-at-least-12-chars
      - FLORABASE_REFERENCES_SETUP=auto          # download WFO/WCVP indexes in the background; set off to disable
    volumes:
      - /volume1/docker/florabase/data:/var/lib/florabase/data      # same data folder as db
      - /volume1/docker/florabase/backup:/var/lib/florabase/backup  # separate backup folder

  frontend:
    image: ghcr.io/alessandrorossato/florabase-frontend:latest
    container_name: florabase-frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Europe/Rome
