# Florabase @VERSION@, linux/amd64: see docs/installation.md
services:
  db:
    image: "@POSTGRESQL@"
    container_name: florabase-db
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Rome}
      - FLORABASE_DB_PASSWORD=${FLORABASE_DB_PASSWORD:?Set FLORABASE_DB_PASSWORD}
    volumes:
      - {type: bind, source: "${FLORABASE_DATA_DIR:?Set FLORABASE_DATA_DIR}", target: /var/lib/postgresql, bind: {create_host_path: false}}

  backend:
    image: "@BACKEND@"
    container_name: florabase-backend
    restart: unless-stopped
    command: ["florabase-start"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      - TZ=${TZ:-Europe/Rome}
      - FLORABASE_DB_PASSWORD=${FLORABASE_DB_PASSWORD:?Set FLORABASE_DB_PASSWORD}
      - FLORABASE_CANONICAL_ORIGIN=${FLORABASE_CANONICAL_ORIGIN:?Set FLORABASE_CANONICAL_ORIGIN}
      - FLORABASE_DATA_DIR=${FLORABASE_DATA_DIR:?Set FLORABASE_DATA_DIR}
      - FLORABASE_BACKUP_DIR=${FLORABASE_BACKUP_DIR:?Set FLORABASE_BACKUP_DIR}
      - FLORABASE_OWNER_LOGIN=${FLORABASE_OWNER_LOGIN:-}
      - FLORABASE_OWNER_PASSWORD=${FLORABASE_OWNER_PASSWORD:-}
    volumes:
      - {type: bind, source: "${FLORABASE_DATA_DIR:?Set FLORABASE_DATA_DIR}", target: /var/lib/florabase/data, bind: {create_host_path: false}}
      - {type: bind, source: "${FLORABASE_BACKUP_DIR:?Set FLORABASE_BACKUP_DIR}", target: /var/lib/florabase/backup, bind: {create_host_path: false}}

  frontend:
    image: "@FRONTEND@"
    container_name: florabase-frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:${FLORABASE_HTTP_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-Europe/Rome}
