name: florabase

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      FLORABASE_ENVIRONMENT: production
      FLORABASE_DATABASE_URL: ${FLORABASE_DATABASE_URL:?Set FLORABASE_DATABASE_URL in .env}
      FLORABASE_CANONICAL_ORIGIN: ${FLORABASE_CANONICAL_ORIGIN:-}
      FLORABASE_COOKIE_MODE: secure
      FLORABASE_CORS_ORIGINS: ${FLORABASE_CORS_ORIGINS:-[]}
      FLORABASE_LOG_LEVEL: ${FLORABASE_LOG_LEVEL:-INFO}
      FLORABASE_LOG_FORMAT: ${FLORABASE_LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [internal]
    init: true
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks: [internal]
    init: true
    stop_grace_period: 10s

networks:
  internal:

volumes:
  postgres_data:
