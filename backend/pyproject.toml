[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "florabase-backend"
version = "0.1.0"
description = "Florabase REST API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=florabase --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: requires the disposable PostgreSQL integration environment",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "LOG", "G", "PIE", "PT", "RET", "RUF", "SIM", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
